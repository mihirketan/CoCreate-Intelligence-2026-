const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));

function daysUntil(s){if(!s)return null;const a=new Date(todayStr()+'T00:00'),b=new Date(s+'T00:00');return Math.round((b-a)/864e5)}
function assess(s){
  const needs=s.techNeeds||[],txt=((s.notes||'')+' '+(s.desc||'')).toLowerCase(),why={webburner:[],nifty:[],partner:[],quality:[],urgency:[]};

  if(s.permission==='Yes'){w+=6;why.webburner.push('Contact permission given')}
  if(s.permission==='No'){w=Math.min(w,20);why.webburner.push('Contact permission refused: score capped')}
  let n=0;
  if(needs.includes('Payments/finance')){n+=30;why.nifty.push('Interested in payments or finance')}
  if(s.challenge==='Cash flow/payments'){n+=25;why.nifty.push('Cash flow or payments is the main challenge')}
  if(/\b(fx|payment|financ|invest|fintech|treasury|currency)/.test(txt)){n+=20;why.nifty.push('Notes mention finance topics')}
  if(['Nifty Money','Both','Partnership'].includes(s.opp)){n+=20;why.nifty.push('You marked a Nifty Money or partnership opportunity')}
  if(!why.nifty.length)why.nifty.push('No finance signal. Most suppliers are not a Nifty Money fit, so this stays low.');
  let p=0;
  if(['Import/export/distribution','Partnership'].includes(s.opp)){p+=30;why.partner.push('You marked '+s.opp.toLowerCase())}
  if(['Distributor','Trading company'].includes(s.stype)){p+=15;why.partner.push('Distribution-type business')}
  if(/uk|europe|eu\b/i.test(s.exports||'')){p+=15;why.partner.push('Already exports to UK or Europe')}
  if(s.privateLabel==='Yes'){p+=5;why.partner.push('Offers private label')}
  if(s.samples==='Yes'){p+=5;why.partner.push('Offers samples')}
  if(s.certs){p+=5;why.partner.push('Certifications recorded')}
  if(s.website){p+=5;why.partner.push('Has a website')}
  if(s.permission==='Yes'){p+=10;why.partner.push('Contact permission given')}
  if(!why.partner.length)why.partner.push('No partnership signals recorded');
  let q=0;const keys=['company','contact','email','phone','country','category','challenge','followUp'];
  const have=keys.filter(k=>s[k]&&s[k]!=='Not recorded');q+=have.length*8;why.quality.push(have.length+' of '+keys.length+' key fields completed');
  if(needs.length){q+=8;why.quality.push('Technology needs recorded')}
  if(validEmail(s.email)){q+=8;why.quality.push('Valid email')}
  if(s.permission==='Yes'){q+=12;why.quality.push('Contact permission given')}
  if(QUALIFIED.includes(s.status)){q+=12;why.quality.push('Status: '+s.status)}
  if(s.source==='Google Form')why.quality.push('Completing the form adds nothing by itself');
  let u=0;const du=daysUntil(s.followUp);
  if(du!==null){if(du<=0){u+=60;why.urgency.push(du<0?'Follow-up overdue':'Follow-up due today')}else if(du<=3){u+=50;why.urgency.push('Follow-up due in '+du+' day(s)')}else if(du<=7){u+=35;why.urgency.push('Follow-up within a week')}else{u+=15;why.urgency.push('Follow-up date set')}}else why.urgency.push('No follow-up date set');
  if(QUALIFIED.includes(s.status)){u+=20;why.urgency.push('Already qualified')}
  if(s.permission==='Yes')u+=10;
  if(s.interactionDate&&daysUntil(s.interactionDate)>=-3){u+=10;why.urgency.push('Recent conversation')}
  const sc={webburner:clamp(w),nifty:clamp(n),partner:clamp(p),quality:clamp(q),urgency:clamp(u)};
  const top=Object.entries({webburner:sc.webburner,nifty:sc.nifty,partner:sc.partner}).sort((a,b)=>b[1]-a[1])[0];
  let next;

  else if(s.permission!=='Yes')next='Ask for permission to follow up before sending anything.';
  else if(top[1]<25)next='Keep as a market-intelligence contact; no commercial follow-up yet.';
  else if(top[0]==='webburner')next='Offer a 20-minute discovery call about '+(core[0]?core[0].toLowerCase():'their technology needs')+'.';
  else if(top[0]==='nifty')next='Explore the finance angle in a short call.';
  else next='Discuss distribution or partnership options.';
  const qs=[];
  if(!s.moq)qs.push('What is your typical MOQ?');if(!s.exports)qs.push('Which markets do you sell to now, and which next?');
  if(!s.challenge||s.challenge==='Not recorded')qs.push('What is the biggest obstacle to growth this year?');
  if(!needs.length)qs.push('Which of these would help most: website, e-commerce, automation, CRM, analytics, distribution?');
  if(!s.website)qs.push('How do buyers find you online today?');
  if(s.ai==='Unknown')qs.push('Do you use any AI or automation tools today?');
  if(!qs.length)qs.push('What would a good outcome from a follow-up call look like?');
  const first=(s.contact||'').split(' ')[0]||'there';
  const msg=s.permission==='Yes'
   ?`Hi ${first},\n\nGood to meet you at CoCreate London${s.booth?' (stand '+s.booth+')':''}. We talked about ${s.challenge&&s.challenge!=='Not recorded'?s.challenge.toLowerCase():'your plans for the UK and Europe'}${s.category?' in '+s.category.toLowerCase():''}.\n\n${top[1]>=25&&top[0]==='webburner'?'I run Webburner Tech, which builds software and automation for growing businesses. Would a 20-minute call next week be useful?':'Would you be open to a short call to continue the conversation?'}\n\nBest,\nMihir`
   :`Do not send a business follow-up yet: permission is ${s.permission==='No'?'refused':'not confirmed'}. If they approached you first, a plain thank-you for the conversation is fine.`;
  const summary=`${s.company||'This supplier'}${s.country?' ('+s.country+')':''} ${s.stype?'is a '+s.stype.toLowerCase():'is a supplier'}${s.category?' in '+s.category.toLowerCase():''}. Main challenge: ${s.challenge&&s.challenge!=='Not recorded'?s.challenge.toLowerCase():'not recorded'}. AI adoption: ${(s.ai||'unknown').toLowerCase()}. Needs: ${needs.length?needs.join(', '):'none recorded'}.`;
  return{sc,why,next,qs,msg,summary};
}

function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}

  if(n.includes('company'))return 'company';if(n.includes('contactperson')||n==='name')return 'contact';if(n.includes('email'))return 'email';
  if(n.includes('country'))return 'country';if(n.includes('productcategory')||n==='category')return 'category';
  if(n.includes('manufacturer')||n.includes('oem')||n.includes('tradingcompany')||n.includes('businesstype')||n.includes('suppliertype'))return 'stype';
  if(n.includes('moq'))return 'moq';if(n.includes('exportmarket'))return 'exports';if(n.includes('challenge'))return 'challenge';
  if(n.includes('interest')||n.includes('technologyrequirement'))return 'techNeeds';if(n.includes('permission')||n.includes('consent'))return 'permission';
  if(n.includes('timestamp'))return 'interactionDate';if(n.includes('phone'))return 'phone';if(n.includes('website'))return 'website';return null}
function mapNeeds(v){const t=String(v).toLowerCase(),o=[];
  if(/\bai\b|automation/.test(t))o.push('AI/automation');if(/website/.test(t))o.push('Website');if(/e-?commerce/.test(t))o.push('E-commerce');if(/crm|erp/.test(t))o.push('CRM/ERP');if(/analytic|\bbi\b/.test(t))o.push('Analytics/BI');if(/distribution/.test(t))o.push('Distribution');return o}
function mapChallenge(v){const t=String(v).toLowerCase();
  if(/customer|buyer|lead|sales/.test(t))return 'Finding customers';if(/logist|ship|freight/.test(t))return 'Logistics/shipping';if(/cash|payment|financ/.test(t))return 'Cash flow/payments';
  if(/digital|website|online|visib/.test(t))return 'Digital presence';if(/complian|uk entry|regulat|customs/.test(t))return 'Compliance/UK entry';if(/cost|margin|price/.test(t))return 'Costs/margins';if(/skill|tech|software/.test(t))return 'Skills/technology';return 'Other'}
function mapStype(v){const t=String(v).toLowerCase();if(/oem/.test(t))return 'OEM';if(/odm/.test(t))return 'ODM';if(/distribut/.test(t))return 'Distributor';if(/trading/.test(t))return 'Trading company';if(/manufact/.test(t))return 'Manufacturer';return 'Other'}
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2)return{added:0,skipped:0,err:'No data rows found. Paste the header row and at least one response.'};
  const map=rows[0].map(mapHeader);if(!map.includes('company'))return{added:0,skipped:0,err:'Could not find a company column. Check the header row.'};
  let added=0,skipped=0;
  rows.slice(1).forEach(r=>{
    const s={id:uid(),source:'Google Form',status:'New',owner:'Mihir',permission:'Unknown',techNeeds:[],opp:'None yet',ai:'Unknown',interactionDate:todayStr()};
    map.forEach((k,i)=>{const v=(r[i]||'').trim();if(!k||!v)return;
      if(k==='techNeeds')s.techNeeds=mapNeeds(v);
      else if(k==='challenge'){s.challenge=mapChallenge(v);s.notes=((s.notes||'')+'Challenge (form): '+v+'\n')}
      else if(k==='stype')s.stype=mapStype(v);
      else if(k==='permission')s.permission=/^(yes|y\b)/i.test(v)||/may contact|you may/i.test(v)?'Yes':'No';
      else if(k==='interactionDate'){const d=new Date(v);if(!isNaN(d))s.interactionDate=dstr(d)}
      else s[k]=v});
    if(!s.company)return;
    const dup=list('suppliers').find(x=>norm(x.company)===norm(s.company)&&(x.email||'').toLowerCase()===(s.email||'').toLowerCase());
    if(dup){skipped++;return}save('suppliers',s);added++});
  return{added,skipped}}

function field(f,v){const [k,label,type,opts]=f,id='f_'+k;let inp;

  else if(type==='select')inp=`<select id="${id}" name="${k}">${opts.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT')return;const f=ACT[t.dataset.act];if(f){if(t.tagName==='A'&&t.dataset.act==='close'){closeSheet();return}f(t,e)}});
